name: Windows desktop installer

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run build:desktop -- --publish never
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Finance Dashboard ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: finance-dashboard-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30